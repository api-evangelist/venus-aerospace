aid: venus-aerospace
name: Venus Aerospace
description: 'Venus Aerospace is a propulsion company building the Venus Rotating Detonation
  Rocket Engine (RDRE) and the Venus Detonation Ramjet (VDR), a hybrid that pairs the
  RDRE with air-breathing ramjet technology to carry a vehicle from takeoff through
  hypersonic cruise on a single engine. The company positions detonation-based propulsion
  — supersonic detonation waves propagating around an annular combustor rather than
  conventional subsonic combustion — for defense munitions and uncrewed systems, space
  upper stages, orbital transfer vehicles and landers, and commercial high-speed flight.
  Venus Aerospace is a hardware and flight-test organization: it publishes a public
  marketing site covering the RDRE, the VDR, its team, investors and newsroom, but no
  developer program, API, SDK or machine-readable specification of any kind.'
